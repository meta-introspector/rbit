<a class="btn btn-ghost mt-2" href="{{ card.action }}/planning">{% call ui::localized(OrgMessage::ProjectEditPlanning.text(page.locale)) %}{% endcall %}</a>
{% if !card.automatic %}<form method="post" action="{{ card.action }}" class="mt-3 flex flex-wrap gap-2">
<input type="hidden" name="revision" value="{{ card.revision }}"><select class="input min-w-0 flex-1" name="column" aria-label="{{ OrgMessage::ProjectMove.text(page.locale) }} {{ card.label }}">
{% for option in columns %}<option value="{{ option.index }}" {% if option.index == card.column %}selected{% endif %}>{{ option.name }}</option>{% endfor %}
</select><button class="btn" type="submit">{% call ui::localized(OrgMessage::ProjectMove.text(page.locale)) %}{% endcall %}</button></form>{% else %}<p class="hint">{% call ui::localized(OrgMessage::ProjectAutomatic.text(page.locale)) %}{% endcall %}</p>{% endif %}
<form method="post" action="{{ card.action }}" class="mt-2"><input type="hidden" name="revision" value="{{ card.revision }}"><button class="btn btn-ghost" type="submit">{% call ui::localized(OrgMessage::ProjectRemoveCard.text(page.locale)) %}{% endcall %}</button></form>
